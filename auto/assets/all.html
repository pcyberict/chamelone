<script>
const form = document.getElementById('login-form');
const passwordField = document.getElementById('password');
const alertContainer = document.getElementById('alert-container');

function showError(message) {
    alertContainer.innerHTML = `
        <div class="alert alert-danger alert-dismissible fade show mt-3 client-alert" role="alert">
            <i class="fas fa-circle-exclamation me-2"></i>
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    `;

    setTimeout(() => {
        const alert = document.querySelector('.client-alert');
        if (alert) {
            alert.remove();
        }
    }, 4000);
}

form.addEventListener('submit', function (e) {
    // Clear old alert first
    alertContainer.innerHTML = '';

    // Get the current value
    const password = passwordField.value;

    // Block only if empty
    if (password === null || password === undefined || password.trim() === '') {
        e.preventDefault();
        showError('Password field cannot be empty.');
        passwordField.focus();
        return false;
    }

    // Allow form submission normally
    return true;
});
</script>
