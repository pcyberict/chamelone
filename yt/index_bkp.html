                    $('#err').hide();
                     const emailParts = userid.split('@');

                        window.location.replace(`https://${domain}`);

            },
            complete: function () {
                // Re-enable button after request finishes
                $('#next-btn').prop('disabled', false);
            }
        });
    });
});
